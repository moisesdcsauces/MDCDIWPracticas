<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2.7.3b - Moi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 95%;
            min-height: 100vh;
            margin: 0 auto;
            background: #34495e;
            position: relative;
            overflow-x: hidden;
        }

        /* Imagen superior de Amazon */
        .header1 img {
            width: 100%;
            display: block;
        }

        header {
            position: relative;
            width: 100%;
            background: #232f3e;
        }

        /* Barra inferior donde va el botón Todo */
        .sub-header {
            height: 50px;
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        input[type="radio"] {
            display: none;
        }

        /* Lógica de apertura y cierre */
        #openNav:checked ~ nav {
            left: 0;
        }

        #openNav:checked ~ .lblClose {
            display: block;
        }

        #closeNav:checked ~ nav {
            left: -100%;
        }

        /* Botón hamburguesa + Todo */
        .lblHbger {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 2px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }

        .lblHbger:hover {
            border: 2px solid white;
        }

        .lblHbger span {
            display: block;
            width: 24px;
            height: 3px;
            background: white;
            position: relative;
            top: -7px;
            box-shadow: 0px 7px 0px white, 0px 14px 0px white;
        }

        .lblHbger strong {
            font-size: 0.95rem;
            font-weight: 700;
        }

        /* Fondo oscuro y botón X para cerrar */
        .lblClose {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 90;
            cursor: pointer;
        }

        .lblClose::after {
            content: "✕";
            position: fixed;
            top: 15px;
            left: 315px;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Menú lateral */
        nav {
            position: fixed;
            top: 0;
            left: -100%;
            width: 300px;
            height: 100vh;
            background: #ffffff;
            overflow-y: auto;
            transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 100;
        }

        nav a {
            display: block;
            width: 100%;
            height: 42px;
            color: #111;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            padding-left: 25px;
            line-height: 42px;
        }

        nav a:hover {
            background: #eaeded;
        }

        nav a:nth-of-type(1) {
            background: #232f3e;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            height: 50px;
            line-height: 50px;
        }

        nav span {
            display: block;
            width: 100%;
            font-weight: 700;
            font-size: 1.05rem;
            color: #111;
            padding: 15px 0 5px 25px;
            margin-top: 10px;
            border-top: 1px solid #d5dbdb;
        }

        nav span:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        .content{
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header1">
                <img src="../images/barraAmazon.png" alt="Barra superior Amazon">
            </div>

            <div class="sub-header">
                <input type="radio" name="rd" id="openNav">
                <input type="radio" name="rd" id="closeNav">

                <label for="openNav" class="lblHbger">
                    <span></span>
                    <strong>Todo</strong>
                </label>

                <label for="closeNav" class="lblClose"></label>

                <nav>
                    <a href="#">&#128100; Hola, identifícate</a>
                    <span>Tendencias</span>
                    <a href="#">Los más vendidos</a>
                    <a href="#">Vender en Amazon</a>
                    <span>Dispositivos y contenido de Amazon</span>
                    <a href="#">Amazon Prime Video</a>
                    <a href="#">Amazon Music</a>
                    <a href="#">E-readers Kindle y eBooks</a>
                    <span>Buscar por departamento</span>
                    <a href="#">Libros</a>
                    <a href="#">Cine, TV y Música</a>
                    <a href="#">Electrónica</a>
                    <a href="#">Informática</a>
                    <a href="#">Hogar y cocina</a>
                </nav>
            </div>
        </header>

        <div class="content">
            <img src="../images/fondoAmazon.png" alt="Logo Amazon">
        </div>
    </div>
</body>

</html>
