<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2.7.5 - Moi</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: sans-serif;
            font-weight: 900;
            margin: 0;
            padding: 0;
        }

        body{
            margin: 5px;
        }        

        .container{
            width: 100%;
            height: 600px;
            background: #999364;
            border: 1px solid #6b7d9e;
            position: relative;
        }

        nav{
            width: 100%;
            background: #aebbcc;
        }

        ul{
            list-style: none;
        }

        li{
            position: relative;
        }

        a{
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            text-align: center;
            line-height: 52px;
            color: #2e3b8e;
            &:hover{
                background: #d2d2d2;
            }
        }

        .mnu{
            position: relative;
            width: 75%;
            height: 52px;
            font-size: 0;
            & > li{
                display: inline-block;
                width: 25%;
                height: 100%;
                font-size: 1rem;
                background: #aebbcc;
                &:hover > .sbmnu1{
                    display: block;
                }
            }
        }

        .sbmnu1, .sbmnu2{
            width: 100%;
            display: none;
            position: absolute;
            z-index: 10;
            & > li{
                width: 100%;
                height: 52px;
                background: #aebbcc;
                position: relative;
            }
        }

        .sbmnu1{
            top: 51px;
            left: 0;
            & > li:hover > .sbmnu2{
                display: block;
            }
        }

        .sbmnu2{
            top: 0;
            left: 99%;
        }

        main{          
            width: 100%;
            height: 52px;
            position: relative;
            padding-top: 700px;
            & h1{
                position: absolute;
                top: 65%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 1.4rem;
                color: black;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <ul class="mnu">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Oficina</a></li>
                <li><a href="#">Instituto&nbsp; &#x25BC</a>
                    <ul class="sbmnu1">
                        <li><a href="#">Fisica-Quimica</a></li>
                        <li><a href="#">Ingles</a></li>
                        <li><a href="#">Matematicas &nbsp; &#x25BA;</a>
                            <ul class="sbmnu2">
                                <li><a href="#">Academicas</a></li>
                                <li><a href="#">Aplicadas</a></li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li><a href="#">Alumnos</a></li>
            </ul>
        </nav>

        <main>
            <h1>MENU DESPLEGABLE (DropDown) con Subniveles</h1>
        </main>
    </div>
</body>

</html>
