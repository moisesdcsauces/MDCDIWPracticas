<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 1.2.2 - Moi</title>
    <style>
        body{
            margin: 5px;
        }
        *{
            box-sizing: border-box;
        }
        h2{
            text-align: center;
        }
        table:nth-of-type(1){
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            & tr td{
                border: 1px solid black;
                &:nth-child(1){
                    width: 55%;
                }
                &:nth-child(2){
                    width: 30%;
                }
                &:nth-child(3){
                    width: 15%;
                }
            }
            & tr:nth-child(even){
                background: red;
                height: 20px;
                border: 1px solid black;
            }
        }
        table:nth-of-type(2){
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin-bottom: 30px;
            & tr td{
                border: 1px solid #a092ff;
                text-align: center;
            }
        }

        /****************************************************/

        .table{
            width: 100%;
            & .row{
                width: 100%; 
                height: 28px;
                font-size: 0px;
                border-bottom: 1px solid #008000;
                &:first-of-type{
                    border-top: 1px solid #008000;
                }
            }
            & .td{
                display: inline-block;
                height: 100%;
                font-size: 16px;
                border-left: 1px solid #008000;
                &:last-of-type{
                    border-right: 1px solid #008000;
                }
            }
            & .row:nth-child(1) .td{
                width: 25%;
            }
            & .row:nth-child(2) .td{
                width: 33.33%;
                &:last-of-type{
                    width: 33.34%;
                }
            }
            & .row:nth-child(3) .td{
                width: 10%;
                text-align: center;
                &:nth-of-type(5){
                    background: #a092ff;
                    color: white;
                }
            }
            & .row:nth-child(4) .td,
            & .row:nth-child(5) .td{
                width: 20%;
            }
        }
    </style>
</head>
<body>
    <h2>Tabla con table</h2>
    <table>
        <tr>
            <td>celda 1 1</td>
            <td>celda 1 2</td>
            <td>celda 1 3</td>
        </tr>
        <tr><td colspan="3"></td></tr>
        <tr>
            <td>celda 2 1</td>
            <td>celda 2 2</td>
            <td>celda 2 3</td>
        </tr>
        <tr><td colspan="3"></td></tr>
        <tr>
            <td>celda 3 1</td>
            <td>celda 3 2</td>
            <td>celda 3 3</td>
        </tr>
        <tr><td colspan="3"></td></tr>
        <tr>
            <td>celda 4 1</td>
            <td>celda 4 2</td>
            <td>celda 4 3</td>
        </tr>
       
    </table>

    <table>
        <tr>
            <td colspan="2">1</td>
            <td colspan="2">1</td>
            <td colspan="4">1</td>
        </tr>
        <tr>
            <td colspan="4">2</td>
            <td colspan="4">2</td>
        </tr>
        <tr>
            <td colspan="3">3</td>
            <td colspan="4">3</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>4</td>
            <td colspan="2">4</td>
            <td colspan="3">4</td>
            <td>4</td>
        </tr>
    </table>

    <h2>Tabla con divs</h2>

    <div class="table">
        <div class="row">
            <div class="td">1</div>
            <div class="td">11</div>
            <div class="td">111</div>
            <div class="td">1111</div>
        </div>
        <div class="row">
            <div class="td">2</div>
            <div class="td">222222</div>
            <div class="td">22222222</div>

        </div>
        <div class="row">
            <div class="td">3</div>
            <div class="td">33</div>
            <div class="td">333</div>
            <div class="td">3333</div>
            <div class="td">33333</div>
            <div class="td">33333</div>
            <div class="td">3333</div>
            <div class="td">333</div>
            <div class="td">33</div>
            <div class="td">3</div>
        </div>
        <div class="row">
            <div class="td">4 1</div>
            <div class="td">4 2</div>
            <div class="td">4 3</div>
            <div class="td">4 4</div>
            <div class="td">4 5</div>
        </div>
        <div class="row">
            <div class="td">5 1</div>
            <div class="td">5 2</div>
            <div class="td">5 3</div>
            <div class="td">5 4</div>
            <div class="td">5 5</div>
        </div>
    </div>
</body>
</html>
