<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2-7-2-b - Moi</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body{
            margin: 5px;
        }

        .wrapper{
            position: relative;
            width: 600px;
            height: 600px;
            background: #eeeeee;
            margin: auto;
        }

        input{
            display: none;
        }

        #mm{
            display: block;
            width: max-content;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 1.3rem;
            background: #008080;
            border-radius: 6px;
            color: white;
            padding: 10px;;
        }

        article{
            width: 100%;
            height: 100%;
            position: absolute;
            top: 40px;
            & label{
                display: inline-block;
                width: 48px;
                height: 48px;
                background: #ff6347;
                text-align: center;
                line-height: 48px;
                font-size: 1.5rem;
                border-radius: 50%;
                font-weight: bold;
                color: white;
                position: absolute;
                right: 10px;
            }
            & p{
                width: 80%;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                position: absolute;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>Ventana modal con :checked y radio buttons</h2>
        <input type="radio" name="rd" id="rdOpen">
        <label for="rdOpen" id="mm">Mostrar modal</label>
        <input type="radio" name="rd" id="rdClose">
        
        <article>
            <label for="rdClose">X</label>

            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dolores atque recusandae eius hic enim nostrum nihil minus aliquid libero quo pariatur consequatur autem repudiandae aperiam porro, perspiciatis in nemo quia!</p>

        </article>
        
    </div>
</body>
</html>
