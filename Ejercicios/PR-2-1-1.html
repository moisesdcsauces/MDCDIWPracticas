<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2.1.1 - Moi</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            margin: 5px;
        }
        header{
            background-color: #999999;
            padding-top: 4px;
        }
 
        header img{
            display: inline-block;
        }
 
        header div{
            display: inline-block;
            vertical-align: middle;
            width: calc(100% / 3 - 4px);
 
            &:nth-of-type(1){
                text-align: end;
            }
 
            &:nth-of-type(2){
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div><img src="https://picsum.photos/id/100/100" alt="foto aleatoria"></div>
            <div><h1>CABECERA</h1></div>
            <div><img src="https://picsum.photos/id/151/100" alt="foto aleatoria"></div>
        </header>
    </div>
    <div class="container-left">
        <aside class="sidebar">
            <nav class="menu">
                <li>Inicio</li>
                <li>Opciones</li>
                <li>Servicios</li>
                <li>Contacto</li>
            </nav>
        </aside>
    </div>
</body>
</html>
