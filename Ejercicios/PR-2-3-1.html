<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica 2.3.1 - Moi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
            font-weight: bold;
        }

        body {
            margin: 5px;
        }

        .container {
            width: 95%;

            & nav {
                width: 400px;
                height: 300px;
                background: #000;
                padding: 10px;
                margin-bottom: 150px;
                & a {
                    display: inline-block;
                    width: 300px;
                    height: 48px;
                    text-decoration: none;
                    text-align: center;
                    line-height: 48px;
                    background: pink;
                    color: white;
                    margin-bottom: 6px;
                    /*transition: all 0.5s ease;*/
                    &:hover{
                        background: #770281;
                        margin-left: 30px;
                    }
                }
            }/*Fin del nav*/

            & section{
                width: 600px;
                background: #000;
                padding: 10px;
                & a{
                    display: inline-block;
                    width: 128px;
                    height: 48px;
                    background: #cd7094;
                    border-radius: 6px;
                    text-align: center;
                    line-height: 48px;
                    text-decoration: none;
                    color: green;
                    &:link{
                        background: white;
                        color: #cd7094;
                    }
                    &:visited{
                        background: red;
                    }
                    &:hover{
                        font-size: 1.2rem;
                    }
                    &:active{
                        border-radius: 1px;
                    }
                }
            }
        }/*Fin container*/
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <a href="#1">1 opcion</a>
            <a href="#2">2 opcion</a>
            <a href="#3">3 opcion</a>
            <a href="#4">4 opcion</a>
        </nav>
        <section>
            <a href="https://www.educa.jcyl.es/es">ECUCACYL</a>
            <a href="https://www.marca.com/">MARCA</a>
            <a href="https://www.youtube.com/">VIDEOS</a>
            <a href="https://picsum.photos/">IMAGENES</a>
        </section>
    </div>
</body>

</html>
