<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 1.1 - Moi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body{
            margin: 5px;
            font-family: sans-serif;
            font-weight: bold;
        }
        table {
            width: 100%;
            table-layout: fixed;
            & td{
                text-align: center;
                padding: 10px;
            }
        }
        table:nth-of-type(1){ 
            & td:nth-of-type(1) {
                background-color: #FF0000;
            }
            & td:nth-of-type(2) {
                background-color: #00FF00;
            }
            & td:nth-of-type(3) {
                background-color: #0000FF;
            }
            
        }
    </style>
</head>
<body>
    <table>
        <caption>Colores Primarios</caption>
        <tr>
            <td>#FF0000</td>
            <td>#00FF00</td>
            <td>#0000FF</td>
        </tr>
    </table>
    <table>
        <caption>Colores Secundarios</caption>
        <tr>
            <td>#FFFF00</td>
            <td>#FF00FF</td>
            <td>#0000FF</td>
            <td>#00FFFF</td>
            <td>#00FF00</td>
        </tr>
</body>
</html>
