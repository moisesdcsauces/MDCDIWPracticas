<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento - Absolute</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-size: 2rem;
            height: 100vh;
        }

        .abuelo {
            width: 600px;
            height: 400px;
            background: grey;
            position: relative;
        }

        .box1,
        .box2,
        .box3,
        .box4 {
            position: absolute;
            padding: 10px;
            color: black;
        }

        .box1,
        .box2 {
            width: 500px;
            height: 135px;
            left: 50px;
        }

        .box2 {
            background: red;
            top: 50px;
        }

        .box1 {
            background: yellow;
            top: 210px;
        }

        .box3,
        .box4 {
            width: 110px;
            height: 340px;
            top: 30px;
        }

        .box3 {
            background: blue;
            left: 110px;
        }

        .box4 {
            background: green;
            left: 375px;
        }
    </style>
</head>

<body>
    <div class="abuelo">
        <div class="padre">
            <div class="box1">2</div>
            <div class="box2">3</div>
            <div class="box3">4</div>
            <div class="box4">5</div>
        </div>
    </div>
</body>

</html>
