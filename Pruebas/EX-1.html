<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX1-1: Botones de efectos con pseudoelementos :before y :after - Moi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .container {
            width: 400px;
            height: 400px;
            position: relative;
            background: rgb(230, 136, 217);
        }

        .boton {
            position: absolute;
            width: 164px;
            height: 64px;
            background: rgb(1, 61, 1);
            text-align: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 5%;
            line-height: 64px;
            top: 100px;
            left: 100px;
            cursor: pointer;

            &::before {
                content: "";
                position: absolute;
                left: 0;
                bottom: 0;
                height: 4px;
                width: 64px;
                background-color: white;
                transition: all 0.5s ease-in-out;
            }

            &::after {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 64px;
                height: 4px;
                background-color: white;
                transition: all 0.5s ease-in-out;
            }

            &:hover::before,
            &:hover::after {
                width: 100%;
            }
        }

        .boton2 {
            position: absolute;
            width: 164px;
            height: 64px;
            background: rgb(1, 61, 1);
            text-align: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 5%;
            line-height: 64px;
            left: 100px;
            bottom: 100px;
            cursor: pointer;

            &::before {
                content: "";
                position: absolute;
                left: 0;
                bottom: 0;
                height: 32px;
                width: 5px;
                background-color: white;
                transition: all 0.5s ease-in-out;
            }

            &::after {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 5px;
                height: 32px;
                background-color: white;
                transition: all 0.5s ease-in-out;
            }

            &:hover::before,
            &:hover::after {
                height: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="boton">
            BOTON
        </div>
        <div class="boton2">
            BOTON2
        </div>
    </div>
</body>

</html>
